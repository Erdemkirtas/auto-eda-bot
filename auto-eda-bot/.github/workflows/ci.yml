name: CI — Auto-EDA Bot

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  # ─────────────────────────────────────────────
  # 1) Backend: Python testleri
  # ─────────────────────────────────────────────
  backend-tests:
    name: 🐍 Backend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-eda-bot/backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ../../requirements.txt
          pip install pytest

      - name: Run tests
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}
          AZURE_OPENAI_API_VERSION: "2024-12-01-preview"
          JWT_SECRET_KEY: "ci-test-secret-key"
        run: pytest tests/ -v --tb=short

  # ─────────────────────────────────────────────
  # 2) Frontend: Build kontrolü
  # ─────────────────────────────────────────────
  frontend-build:
    name: ⚛️ Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: auto-eda-bot/frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: auto-eda-bot/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
