# ==============================================================================
# docker-compose.yml — Auto-EDA Bot Full-Stack
# ==============================================================================
# Tek komutla tüm sistemi ayağa kaldırır:
#   docker-compose up --build
#
# Servisler:
#   - backend:  FastAPI + LangChain Agent (port 8000)
#   - frontend: React/Vite + Nginx       (port 80 → tarayıcıdan erişim)
#
# Not: LLM servisi (Ollama) host makinede çalışmalıdır.
#      extra_hosts ayarı ile container'dan host'a erişim sağlanır.
# ==============================================================================

version: "3.9"

services:

  # ---- BACKEND ----
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eda-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      # Veri dosyaları ve çıktıları container dışında kalıcı tut
      - ./data:/app/../data
      - ./output:/app/../output
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    extra_hosts:
      # Container içinden host makinedeki Ollama'ya erişim
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ---- FRONTEND ----
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eda-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy

